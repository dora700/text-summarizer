# ============================================================
# Build & Release: text-summarizer Executa binaries
# ============================================================
# Manually-triggered (workflow_dispatch only — never runs on push/PR).
# Builds the Python Executa (executas/text-summarizer) into standalone
# PyInstaller binaries for darwin-arm64, darwin-x86_64, linux-x86_64, and
# windows-x86_64, packages each as .tar.gz (Unix) / .zip (Windows) with a
# SHA-256 checksum file, and publishes both to a GitHub Release. Binaries
# are never committed to the repo — they only ever live as workflow
# artifacts and Release assets.
#
# Runner images (checked against actions/runner-images on 2026-08-14, not
# guessed): macos-13/macos-14 are deprecated, so this pins the current GA
# images — ubuntu-24.04, windows-2025, and a single macos-15 (Apple
# Silicon / arm64) leg. All are explicit versioned labels rather than
# "*-latest" aliases, so a future GitHub-side default bump can't silently
# change what this workflow builds on.
#
# No Intel-only "-large" runner is used anywhere. GitHub's Intel macOS
# runners only exist in that paid "-large" tier (no free/standard Intel
# Mac size at all) and are billed even when the account has unused free
# Actions minutes.
#
# linux-x86_64 and windows-x86_64 build with PyInstaller `--onedir`
# (untouched pending the macOS fix below being confirmed).
#
# darwin-arm64 has been through three real-install debugging rounds:
#   1. --onefile crashed on Agent launch: "Argument 'sig' has incorrect
#      type (expected int, got Signals)".
#   2. --onedir hit the EXACT SAME crash, ruling out onefile's
#      self-extracting bootloader specifically.
#   3. Nuitka (zero PyInstaller bootloader code) hit the SAME crash again,
#      ruling out PyInstaller's bootloader entirely.
# Comparing against two OTHER executas on the same account that the Agent
# launches fine (both plain PyInstaller --onefile Mach-O binaries) found
# one concrete difference: both working installs ship an archive-root
# `manifest.json` (runtime.binary.entrypoint + permissions) that ours
# never included. darwin-arm64 is back to a plain --onefile build with
# that manifest.json added — see the `build-macos-arm64` job. Not yet
# confirmed working; darwin-x86_64/linux-x86_64/windows-x86_64 stay on
# their existing --onedir builds until this is verified.
# ============================================================

name: Build Executa Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (default: text-summarizer-v<executa.json version>)"
        required: false
        default: ""

permissions:
  contents: write

env:
  EXECUTA_DIR: executas/text-summarizer
  EXECUTA_NAME: text-summarizer
  PLUGIN_FILE: text_summarizer_plugin.py

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('${EXECUTA_DIR}/executa.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${EXECUTA_NAME}-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG}"

  # ── Linux + Windows: plain PyInstaller, one native arch per runner ──
  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          pyinstaller --onedir --name "${EXECUTA_NAME}" \
            --clean --noconfirm --strip --noupx \
            "${PLUGIN_FILE}"

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          pyinstaller --onedir --name "$env:EXECUTA_NAME" `
            --clean --noconfirm `
            "$env:PLUGIN_FILE"

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          '{"jsonrpc":"2.0","method":"describe","id":1}' | .\dist\text-summarizer\text-summarizer.exe | `
            python -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          # ${EXECUTA_NAME} is now the onedir OUTPUT FOLDER (not a single
          # file) — tar archives it recursively as-is, entrypoint ends up
          # at "${EXECUTA_NAME}/${EXECUTA_NAME}" inside the archive.
          ARCHIVE="${EXECUTA_NAME}-${VERSION}-${PLATFORM}.tar.gz"
          tar czf "$ARCHIVE" "${EXECUTA_NAME}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        shell: pwsh
        run: |
          # ${EXECUTA_NAME} is the onedir output FOLDER now, not
          # "${EXECUTA_NAME}.exe" — compress the whole folder.
          $Archive = "${env:EXECUTA_NAME}-${env:VERSION}-${env:PLATFORM}.zip"
          Compress-Archive -Path "${env:EXECUTA_NAME}" -DestinationPath $Archive
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $Archive).Hash.ToLower()
          "$Hash  $Archive" | Out-File -Encoding ascii "$Archive.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$Archive"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-${{ env.PLATFORM }}
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256

  # ── macOS: darwin-arm64 ONLY. The Nuitka experiment (no PyInstaller
  #    bootloader at all) crashed with the EXACT SAME "Argument 'sig' has
  #    incorrect type (expected int, got Signals)" error under the Agent,
  #    which rules out PyInstaller's bootloader entirely as the cause.
  #
  #    Comparing against two OTHER locally-installed executas from this
  #    same account that the Agent launches fine (wefinance-recommend,
  #    wefinance-chat — both plain PyInstaller --onefile Mach-O binaries)
  #    found one concrete structural difference: both working installs
  #    have an archive-root `manifest.json` declaring
  #    `runtime.binary.entrypoint` + `permissions`, which our archives
  #    never included. This job reverts to a plain PyInstaller --onefile
  #    build (proven to work for other tools on this Agent) and adds that
  #    manifest.json, matching the working examples' structure exactly.
  #
  #    darwin-x86_64 is intentionally left untouched again — still on the
  #    last PyInstaller universal2 build — until this is confirmed fixed.
  build-macos-arm64:
    needs: resolve-version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      # This project's already-published tool_id — mirrors the "name" field
      # convention seen in the two working reference installs' archive-root
      # manifest.json. Update this if the executa is ever re-published
      # under a different handle/tool_id.
      TOOL_ID: tool-dorajlin-text-summarizer-p73hr6wf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          pyinstaller --onefile --name "${EXECUTA_NAME}" \
            --clean --noconfirm --strip --noupx \
            "${PLUGIN_FILE}"

      - name: Ad-hoc codesign
        working-directory: ${{ env.EXECUTA_DIR }}
        run: codesign --force --sign - "dist/${EXECUTA_NAME}" || true

      - name: Smoke-test binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Write archive-root manifest.json and package
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          cat > manifest.json <<JSON
          {
            "name": "${TOOL_ID}",
            "version": "${VERSION}",
            "runtime": {
              "binary": {
                "entrypoint": "${EXECUTA_NAME}",
                "permissions": { "${EXECUTA_NAME}": "0o755" }
              }
            }
          }
          JSON
          ARCHIVE="${EXECUTA_NAME}-${VERSION}-darwin-arm64.tar.gz"
          tar czf "$ARCHIVE" "${EXECUTA_NAME}" manifest.json
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-darwin-arm64
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256