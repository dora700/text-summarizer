# ============================================================
# Build & Release: text-summarizer Executa binaries
# ============================================================
# Manually-triggered (workflow_dispatch only — never runs on push/PR).
# Builds the Python Executa (executas/text-summarizer) into standalone
# PyInstaller binaries for darwin-arm64, darwin-x86_64, linux-x86_64, and
# windows-x86_64, packages each as .tar.gz (Unix) / .zip (Windows) with a
# SHA-256 checksum file, and publishes both to a GitHub Release. Binaries
# are never committed to the repo — they only ever live as workflow
# artifacts and Release assets.
#
# Runner images (checked against actions/runner-images on 2026-08-14, not
# guessed): macos-13/macos-14 are deprecated, so this pins the current GA
# images — ubuntu-24.04, windows-2025, and a single macos-15 (Apple
# Silicon / arm64) leg. All are explicit versioned labels rather than
# "*-latest" aliases, so a future GitHub-side default bump can't silently
# change what this workflow builds on.
#
# No Intel-only "-large" runner is used anywhere. GitHub's Intel macOS
# runners only exist in that paid "-large" tier (no free/standard Intel
# Mac size at all) and are billed even when the account has unused free
# Actions minutes.
#
# linux-x86_64 and windows-x86_64 build with PyInstaller `--onedir`, not
# `--onefile` — the first real install (macOS) crashed on launch with
# "Argument 'sig' has incorrect type (expected int, got Signals)", a known
# class of bug in PyInstaller's `--onefile` bootloader.
#
# The macOS leg went further: even after switching to `--onedir`, the
# SAME crash still happened when the Anna Agent launched the binary —
# even though the identical binary ran fine when invoked directly outside
# the Agent. That rules out onefile's self-extracting bootloader as the
# actual cause. The macOS job now builds with Nuitka instead of
# PyInstaller (no bootloader stub at all) to isolate whether the bug is
# in PyInstaller's runtime shim in general, or in the Agent's own process
# spawning. See the `build-macos-arm64-nuitka` job below for details —
# it currently covers darwin-arm64 ONLY (Nuitka has no universal2
# equivalent), darwin-x86_64 still ships the last PyInstaller build.
# ============================================================

name: Build Executa Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (default: text-summarizer-v<executa.json version>)"
        required: false
        default: ""

permissions:
  contents: write

env:
  EXECUTA_DIR: executas/text-summarizer
  EXECUTA_NAME: text-summarizer
  PLUGIN_FILE: text_summarizer_plugin.py

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('${EXECUTA_DIR}/executa.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${EXECUTA_NAME}-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG}"

  # ── Linux + Windows: plain PyInstaller, one native arch per runner ──
  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          pyinstaller --onedir --name "${EXECUTA_NAME}" \
            --clean --noconfirm --strip --noupx \
            "${PLUGIN_FILE}"

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          pyinstaller --onedir --name "$env:EXECUTA_NAME" `
            --clean --noconfirm `
            "$env:PLUGIN_FILE"

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          '{"jsonrpc":"2.0","method":"describe","id":1}' | .\dist\text-summarizer\text-summarizer.exe | `
            python -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          # ${EXECUTA_NAME} is now the onedir OUTPUT FOLDER (not a single
          # file) — tar archives it recursively as-is, entrypoint ends up
          # at "${EXECUTA_NAME}/${EXECUTA_NAME}" inside the archive.
          ARCHIVE="${EXECUTA_NAME}-${VERSION}-${PLATFORM}.tar.gz"
          tar czf "$ARCHIVE" "${EXECUTA_NAME}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        shell: pwsh
        run: |
          # ${EXECUTA_NAME} is the onedir output FOLDER now, not
          # "${EXECUTA_NAME}.exe" — compress the whole folder.
          $Archive = "${env:EXECUTA_NAME}-${env:VERSION}-${env:PLATFORM}.zip"
          Compress-Archive -Path "${env:EXECUTA_NAME}" -DestinationPath $Archive
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $Archive).Hash.ToLower()
          "$Hash  $Archive" | Out-File -Encoding ascii "$Archive.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$Archive"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-${{ env.PLATFORM }}
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256

  # ── macOS: EXPERIMENT — darwin-arm64 ONLY, built with Nuitka instead of
  #    PyInstaller. Real-world testing showed the Agent-launched PyInstaller
  #    --onedir binary crashes with the exact same "Argument 'sig' has
  #    incorrect type (expected int, got Signals)" error as the original
  #    --onefile build, even though the identical binary runs fine when
  #    invoked directly (outside the Agent). That rules out onefile's
  #    self-extracting bootloader as the cause; the next most likely
  #    culprit is PyInstaller's bootloader stub in general (onedir still
  #    uses one). Nuitka compiles to a real native binary with no PyInstaller
  #    bootloader at all, so if THIS still crashes under the Agent, the bug
  #    is almost certainly in the Agent's own process-spawning code, not in
  #    how we package the executa.
  #
  #    Nuitka has no --target-arch universal2 equivalent (unlike PyInstaller,
  #    it compiles for whatever arch it runs on — no built-in fat-binary
  #    support), so this job deliberately does NOT touch darwin-x86_64 this
  #    round: publishing an arm64-only binary under the x86_64 key would
  #    actively break Intel Macs, which is worse than leaving x86_64 on the
  #    last known-good PyInstaller universal2 build. Revisit x86_64 (e.g.
  #    lipo-merging two separately-compiled Nuitka binaries) once this
  #    experiment confirms Nuitka actually fixes the Agent-launch crash.
  build-macos-arm64-nuitka:
    needs: resolve-version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nuitka
        run: pip install nuitka

      # --standalone with NO --onefile: a plain directory of the compiled
      # binary + its bundled deps, no self-extracting wrapper of any kind.
      - name: Build with Nuitka
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          python3 -m nuitka --standalone \
            --output-filename="${EXECUTA_NAME}" \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            "${PLUGIN_FILE}"
          # Nuitka names the output dir after the script
          # (text_summarizer_plugin.dist/); rename to match the existing
          # packaging/entrypoint convention used elsewhere in this workflow
          # and in executa.json ("text-summarizer/text-summarizer").
          mv "dist/${PLUGIN_FILE%.py}.dist" "dist/${EXECUTA_NAME}"

      - name: Verify architecture (sanity check, not universal2 this round)
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          ARCHS=$(lipo -archs "dist/${EXECUTA_NAME}/${EXECUTA_NAME}")
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64 || { echo "::error::expected an arm64 binary from the macos-15 (Apple Silicon) runner, got: $ARCHS"; exit 1; }

      - name: Ad-hoc codesign
        working-directory: ${{ env.EXECUTA_DIR }}
        run: codesign --force --deep --sign - "dist/${EXECUTA_NAME}" || true

      - name: Smoke-test binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Package darwin-arm64
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          ARCHIVE="${EXECUTA_NAME}-${VERSION}-darwin-arm64.tar.gz"
          tar czf "$ARCHIVE" "${EXECUTA_NAME}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-darwin-arm64-nuitka
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256