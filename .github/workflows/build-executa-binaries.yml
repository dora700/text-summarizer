# ============================================================
# Build & Release: text-summarizer Executa binaries
# ============================================================
# Manually-triggered (workflow_dispatch only — never runs on push/PR).
# Builds the Python Executa (executas/text-summarizer) into standalone
# PyInstaller binaries for darwin-arm64, darwin-x86_64, linux-x86_64, and
# windows-x86_64, packages each as .tar.gz (Unix) / .zip (Windows) with a
# SHA-256 checksum file, and publishes both to a GitHub Release. Binaries
# are never committed to the repo — they only ever live as workflow
# artifacts and Release assets.
#
# Runner images (checked against actions/runner-images on 2026-08-14, not
# guessed): macos-13/macos-14 are deprecated, so this pins the current GA
# images — ubuntu-24.04, windows-2025, and a single macos-15 (Apple
# Silicon / arm64) leg. All are explicit versioned labels rather than
# "*-latest" aliases, so a future GitHub-side default bump can't silently
# change what this workflow builds on.
#
# No Intel-only "-large" runner is used anywhere. GitHub's Intel macOS
# runners only exist in that paid "-large" tier (no free/standard Intel
# Mac size at all) and are billed even when the account has unused free
# Actions minutes. Instead, the darwin-x86_64 leg is produced by building
# a genuine universal2 (arm64 + x86_64 fat) binary on the standard
# (free-tier) macos-15 runner via PyInstaller's official
# `--target-arch universal2` support, using Python.org's universal2 macOS
# installer. The same binary bytes are then published under both the
# darwin-arm64 and darwin-x86_64 platform keys. This has not been run in
# CI yet — the "Verify both architectures are present" step hard-fails
# the job with a clear error if the universal2 build doesn't actually
# contain both slices, rather than silently shipping a broken artifact.
# ============================================================

name: Build Executa Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (default: text-summarizer-v<executa.json version>)"
        required: false
        default: ""

permissions:
  contents: write

env:
  EXECUTA_DIR: executas/text-summarizer
  EXECUTA_NAME: text-summarizer
  PLUGIN_FILE: text_summarizer_plugin.py

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('${EXECUTA_DIR}/executa.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${EXECUTA_NAME}-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG}"

  # ── Linux + Windows: plain PyInstaller, one native arch per runner ──
  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          pyinstaller --onefile --name "${EXECUTA_NAME}" \
            --clean --noconfirm --strip --noupx \
            "${PLUGIN_FILE}"

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          pyinstaller --onefile --name "$env:EXECUTA_NAME" `
            --clean --noconfirm `
            "$env:PLUGIN_FILE"

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}
        shell: pwsh
        run: |
          '{"jsonrpc":"2.0","method":"describe","id":1}' | .\dist\text-summarizer.exe | `
            python -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          ARCHIVE="${EXECUTA_NAME}-${VERSION}-${PLATFORM}.tar.gz"
          tar czf "$ARCHIVE" "${EXECUTA_NAME}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        shell: pwsh
        run: |
          $Archive = "${env:EXECUTA_NAME}-${env:VERSION}-${env:PLATFORM}.zip"
          Compress-Archive -Path "${env:EXECUTA_NAME}.exe" -DestinationPath $Archive
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $Archive).Hash.ToLower()
          "$Hash  $Archive" | Out-File -Encoding ascii "$Archive.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$Archive"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-${{ env.PLATFORM }}
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}
            ${{ env.EXECUTA_DIR }}/dist/${{ env.ARCHIVE }}.sha256

  # ── macOS: ONE universal2 binary on the free-tier arm64 runner,
  #    published under BOTH darwin-arm64 and darwin-x86_64. Avoids the
  #    Intel-only "macos-*-large" runner entirely (see header comment).
  build-macos-universal2:
    needs: resolve-version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      # 3.12.10 is the latest CPython 3.12 release that has an official
      # universal2 macOS installer; later 3.12 releases are source-only.
      PYTHON_VERSION: "3.12.10"
      PYTHON_BIN: ${{ runner.temp }}/pyinstaller-universal2/bin/python
    steps:
      - uses: actions/checkout@v4

      # Python.org's macOS installer provides the required universal2 build
      # build (per PyInstaller's own docs) — needed because PyInstaller
      # can only produce a universal2 *output* when run under a
      # universal2 *interpreter*. actions/setup-python's cached builds
      # are single-arch, so this job deliberately skips that action.
      - name: Install universal2 Python and create virtual environment
        run: |
          curl --fail --location --retry 3 \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg" \
            --output "$RUNNER_TEMP/python-universal2.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python-universal2.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 \
            -m venv "$RUNNER_TEMP/pyinstaller-universal2"
          lipo -archs "$PYTHON_BIN" | grep -qw x86_64
          lipo -archs "$PYTHON_BIN" | grep -qw arm64

      - name: Install PyInstaller
        run: |
          "${PYTHON_BIN}" -m pip install --upgrade pip pyinstaller

      - name: Build universal2 binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          "${PYTHON_BIN}" -m PyInstaller --onefile --target-arch universal2 \
            --name "${EXECUTA_NAME}" --clean --noconfirm --strip --noupx \
            "${PLUGIN_FILE}"

      # Hard-fail rather than silently ship a single-arch binary mislabeled
      # as universal — this is the load-bearing check for this whole job.
      - name: Verify both architectures are present
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          ARCHS=$(lipo -archs "dist/${EXECUTA_NAME}")
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64 || { echo "::error::built binary is missing the x86_64 slice — not a real universal2 build"; exit 1; }
          echo "$ARCHS" | grep -qw arm64  || { echo "::error::built binary is missing the arm64 slice — not a real universal2 build"; exit 1; }

      - name: Ad-hoc codesign
        working-directory: ${{ env.EXECUTA_DIR }}
        run: codesign --force --sign - "dist/${EXECUTA_NAME}" || true

      - name: Smoke-test binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/${EXECUTA_NAME}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['name']=='tool-dev-text-summarizer'; print('describe OK')"

      - name: Package for both darwin platforms
        working-directory: ${{ env.EXECUTA_DIR }}/dist
        run: |
          for PLATFORM in darwin-arm64 darwin-x86_64; do
            ARCHIVE="${EXECUTA_NAME}-${VERSION}-${PLATFORM}.tar.gz"
            tar czf "$ARCHIVE" "${EXECUTA_NAME}"
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTA_NAME }}-darwin-universal2
          path: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-x86_64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz.sha256
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-x86_64.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/${{ env.EXECUTA_NAME }}-${{ env.VERSION }}-darwin-x86_64.tar.gz.sha256